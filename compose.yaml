name: CloudflareTunnel
services:
  CloudflareTunnel:
    image: cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    user: "${UID}:${GID}"
    container_name: CloudflareTunnel
    restart: unless-stopped
    networks:
      - CloudflareTunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
# Assumes you have already created a Docker Network called 'CloudflareTunnel' (ex 'docker network create CloudflareTunnel'). See the README for more information.
networks:
  CloudflareTunnel:
    name: CloudflareTunnel
    external: true
