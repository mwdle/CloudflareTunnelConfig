name: CloudflareTunnel
services:
  CloudflareTunnel:
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: CloudflareTunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_METRICS=127.0.0.1:60123 # For healthcheck
    networks:
      - CloudflareTunnel

    user: "${UID}:${GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: journald
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: 1
          memory: 256M
          pids: 30

# Assumes you have already created a Docker Network called 'CloudflareTunnel' (ex 'docker network create CloudflareTunnel'). See the README for more information.
networks:
  CloudflareTunnel:
    name: CloudflareTunnel
    external: true
